<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mascotas Solaris — vista previa</title>
<link rel="icon" href="solaris/favicon/favicon.ico" sizes="any">
<link rel="icon" href="solaris/favicon/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="tokens/colores.css">
<style>
body{margin:0;background:#0f0d0a;color:#f7efdd;font-family:var(--font-texto);padding:40px}
h1{font-family:var(--font-titulares);font-weight:600}
.hero{display:flex;gap:40px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
figure{margin:0;background:#1b1712;border-radius:16px;padding:12px;text-align:center}
figcaption{font-size:13px;color:#b7ad99}
</style></head><body>
<h1>Mascotas Solaris · v1.0</h1>
<div class="hero">
<img src="solaris/svg/solaris-animado.svg" width="280" height="280" alt="Solaris">
<img src="negro/svg/negro-animado.svg" width="280" height="280" alt="Personaje negro">
</div>
<h2>Estados</h2>
<div class="grid">
<figure><img src="solaris/svg/estados/solaris-reposo.svg" width="160" height="160" alt="Solaris — reposo"><figcaption>solaris · reposo</figcaption></figure>
<figure><img src="solaris/svg/estados/solaris-escuchando.svg" width="160" height="160" alt="Solaris — escuchando"><figcaption>solaris · escuchando</figcaption></figure>
<figure><img src="solaris/svg/estados/solaris-pensando.svg" width="160" height="160" alt="Solaris — pensando"><figcaption>solaris · pensando</figcaption></figure>
<figure><img src="solaris/svg/estados/solaris-hablando.svg" width="160" height="160" alt="Solaris — hablando"><figcaption>solaris · hablando</figcaption></figure>
<figure><img src="solaris/svg/estados/solaris-logrado.svg" width="160" height="160" alt="Solaris — logrado"><figcaption>solaris · logrado</figcaption></figure>
<figure><img src="solaris/svg/estados/solaris-error.svg" width="160" height="160" alt="Solaris — error"><figcaption>solaris · error</figcaption></figure>
<figure><img src="solaris/svg/estados/solaris-pausa.svg" width="160" height="160" alt="Solaris — pausa"><figcaption>solaris · pausa</figcaption></figure>
<figure><img src="negro/svg/estados/negro-reposo.svg" width="160" height="160" alt="Personaje negro (nombre pendiente) — reposo"><figcaption>negro · reposo</figcaption></figure>
<figure><img src="negro/svg/estados/negro-escuchando.svg" width="160" height="160" alt="Personaje negro (nombre pendiente) — escuchando"><figcaption>negro · escuchando</figcaption></figure>

<figure><img src="negro/svg/estados/negro-logrado.svg" width="160" height="160" alt="Personaje negro (nombre pendiente) — logrado"><figcaption>negro · logrado</figcaption></figure>

<figure><img src="negro/svg/estados/negro-pausa.svg" width="160" height="160" alt="Personaje negro (nombre pendiente) — pausa"><figcaption>negro · pausa</figcaption></figure>
</div>
