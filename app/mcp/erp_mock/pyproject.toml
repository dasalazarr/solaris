[project]
name = "solaris-erp-mock"
version = "0.1.0"
description = "Servidor MCP de solo lectura sobre el ERP mock de Componentes Arga (F05). Datos 100% sintéticos."
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp>=1.20,<2",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["solaris_erp_mock"]

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[project.scripts]
solaris-erp-mock = "solaris_erp_mock.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # textos en español con tildes y guiones

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
