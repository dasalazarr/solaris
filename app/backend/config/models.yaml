# Ficha de modelo por tarea (F10, ADR-0003). Todas las llamadas pasan por solaris.llm.route().
#
# - Cambiar de modelo = editar este fichero (sin desplegar código).
# - Los ids de OpenRouter son PROVISIONALES: se validan en M3-T5 contra el golden set
#   (calidad, latencia p95, coste por 8D) y entonces se rellena eval_score.
# - provider_policy se envía tal cual como objeto `provider` de OpenRouter.
#   data_collection: deny -> solo proveedores que no retienen/entrenan con los prompts.
#   zdr: true exigiría endpoints Zero Data Retention; se deja comentado hasta verificar
#   en M3-T5 que el modelo elegido tiene endpoint ZDR (si no, la llamada fallaría).
# - Demo = solo datos sintéticos (ADR-0004). Ruta UE-only antes de cualquier piloto real.

# Anclas YAML compartidas; cada tarea lleva su ficha completa y explícita.
_shared:
  policy: &policy
    data_collection: deny
    allow_fallbacks: true
    # zdr: true
    # order: [deepinfra, together]
  # M3-T5 / decisión del fundador 2026-09-27 (config "mixta"): ruta de región UE con ZDR para
  # parser, 8D y traducción (sondeado: google-vertex/eu y mistral/eu aceptan zdr).
  policy_eu: &policy_eu
    data_collection: deny
    zdr: true
    only: [google-vertex/eu, mistral/eu]
    allow_fallbacks: false
  deepseek: &deepseek {organization: DeepSeek, country: CN}
  mistral: &mistral {organization: Mistral AI, country: FR}
  google: &google {organization: Google, country: US}
  region_note_eu: &region_note_eu >-
    Modelo propietario de EE. UU. (Google) servido en Vertex AI región UE con ZDR; fallback
    Mistral (FR) en región UE. Sin proveedores CN. Sujeto a CLOUD Act (R01). M3-T5.
  region_note: &region_note >-
    Modelo de pesos abiertos de origen CN servido por proveedores de OpenRouter
    (mayoría EE. UU.); no hay garantía de región UE. Aceptable solo con datos
    sintéticos. Fallback de origen UE (Mistral, FR). Tensión con soberanía: R01.

tasks:
  rag_answer:
    model: deepseek/deepseek-chat
    fallback: mistralai/mistral-medium-3
    # M2-T6: mismo pool (data_collection: deny) ordenado por throughput; con el orden por defecto
    # un proveedor tardó 27 s en 300 tokens (p95 del gate < 8 s). Pendiente de revisión de security.
    provider_policy:
      <<: *policy
      sort: throughput
    provenance: *deepseek
    fallback_provenance: *mistral
    region_note: *region_note
    max_tokens: 1500
    temperature: 0.1
    eval_score: 0.93  # qa rag_answer.v3 2026-09-26 (p95 10,0 s ✗); gemini 0,774 (p95 4,2 s). Se mantiene DeepSeek por calidad de citas

  complaint_parse:
    model: google/gemini-2.5-flash
    fallback: mistralai/mistral-medium-3.1
    provider_policy: *policy_eu
    provenance: *google
    fallback_provenance: *mistral
    region_note: *region_note_eu
    max_tokens: 1200
    temperature: 0.0
    eval_score: 1.0   # suite complaints 2026-09-27: 50/50 campos, 3 canales, 0 FP, 0 fugas

  8d_draft:
    model: google/gemini-2.5-flash
    fallback: mistralai/mistral-medium-3.1
    provider_policy: *policy_eu
    provenance: *google
    fallback_provenance: *mistral
    region_note: *region_note_eu
    max_tokens: 4000
    temperature: 0.2
    eval_score: 0.6   # suite 8d 2026-09-27: 6/10 PASS (2 pasadas); p50 23,5 s, máx 27,2 s; 0,014 $/8D

  translate:
    model: google/gemini-2.5-flash
    fallback: mistralai/mistral-medium-3.1
    provider_policy: *policy_eu
    provenance: *google
    fallback_provenance: *mistral
    region_note: *region_note_eu
    max_tokens: 2000
    temperature: 0.0
    eval_score: null  # sin suite propia; usado por la recuperación ES↔EN
