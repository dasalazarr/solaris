[project]
name = "solaris"
version = "0.1.0"
description = "Solaris (Illarium Industrial OS) — backend del demo 8D. Datos 100% sintéticos."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "psycopg[binary]>=3.2",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "pypdf>=6.19.0",
    "pillow>=12.3.0",
    "rapidocr-onnxruntime>=1.4.4",
    "fastembed>=0.8.1",
    "pyjwt>=2.9",
    "python-multipart>=0.0.20",
    "langgraph>=0.6",
    "langgraph-checkpoint-postgres>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["solaris"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # textos en español con tildes y guiones

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
